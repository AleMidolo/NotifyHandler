name: Browser runtime

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .nvmrc
      - .npmrc
      - .github/workflows/browser-runtime.yml
      - packages/application/**
      - packages/automation/**
      - packages/bookmakers/**
      - packages/desktop/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-bootstrap:
    name: Pinned Chromium browser fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright Chromium runtime
        run: npm run browser:install:ci

      - name: Verify pinned Playwright version
        run: node ./node_modules/playwright-core/cli.js --version

      - name: Run deterministic Chromium fixture suites
        run: |
          npm run test:browser --workspace @notify-handler/automation
          npm run test:browser --workspace @notify-handler/desktop

      - name: Install locked Electron smoke runtime
        run: |
          node node_modules/electron/install.js
          electron_binary="node_modules/electron/dist/electron"
          sandbox_helper="node_modules/electron/dist/chrome-sandbox"
          ls -l "$electron_binary" "$sandbox_helper"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"
          ls -l "$sandbox_helper"

      - name: Smoke-launch local desktop shell
        run: |
          set -o pipefail
          electron_binary="node_modules/electron/dist/electron"
          timeout 120s xvfb-run -a "$electron_binary" --experimental-transform-types packages/desktop/src/electron-main.mjs --notifyhandler-smoke-test 2>&1 | tee /tmp/notifyhandler-desktop-smoke.log
          grep -F "NotifyHandler desktop shell smoke ready" /tmp/notifyhandler-desktop-smoke.log
