name: Browser runtime

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .nvmrc
      - .npmrc
      - .github/workflows/browser-runtime.yml
      - packages/application/**
      - packages/automation/**
      - packages/bookmakers/**
      - packages/desktop/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-bootstrap:
    name: Pinned Chromium browser fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright Chromium runtime
        run: npm run browser:install:ci

      - name: Verify pinned Playwright version
        run: npm exec --yes --package=playwright@1.63.0 -- playwright --version

      - name: Run deterministic Chromium fixture suites
        run: |
          npm run test:browser --workspace @notify-handler/automation
          npm run test:browser --workspace @notify-handler/desktop

      - name: Smoke-launch local desktop shell
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a npm run desktop:dev -- --notifyhandler-smoke-test 2>&1 | tee /tmp/notifyhandler-desktop-smoke.log
          grep -F "NotifyHandler desktop shell smoke ready" /tmp/notifyhandler-desktop-smoke.log
